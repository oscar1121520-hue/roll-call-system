<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>班級管理系統 - 極速總覽版</title>
    <style>
        :root { --primary: #1a73e8; --secondary: #34a853; --danger: #ea4335; --warning: #fbbc05; --bg: #f8f9fa; }
        body { font-family: -apple-system, "Microsoft JhengHei", sans-serif; background: var(--bg); margin: 0; padding: 15px; color: #333; }
        .container { max-width: 500px; margin: 0 auto; background: white; padding: 20px; border-radius: 16px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); }
        h1 { color: var(--primary); text-align: center; font-size: 22px; margin-bottom: 20px; }
        label { display: block; font-weight: bold; margin: 12px 0 6px; color: #555; }
        .day-label { font-size: 14px; color: var(--primary); font-weight: bold; margin-bottom: 10px; display: block; }
        select, input { width: 100%; padding: 12px; border: 1px solid #dadce0; border-radius: 8px; box-sizing: border-box; font-size: 16px; margin-bottom: 5px; }
        .btn { width: 100%; padding: 14px; border: none; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer; transition: 0.2s; margin-top: 10px; }
        .btn-blue { background: var(--primary); color: white; }
        .card { border: 1px solid #eee; border-radius: 12px; padding: 15px; margin-bottom: 12px; background: #fafafa; position: relative; }
        .status-group { display: flex; gap: 8px; margin: 10px 0; }
        .status-btn { flex: 1; padding: 10px; border: 2px solid #ddd; border-radius: 8px; text-align: center; cursor: pointer; font-weight: bold; }
        .active-p { border-color: var(--secondary); background: #e6f4ea; color: #1e8e3e; }
        .active-a { border-color: var(--danger); background: #fce8e8; color: #d93025; }
        .memo-input { width: 100%; padding: 8px; border: 1px solid #eee; border-radius: 6px; box-sizing: border-box; }
        .sync-indicator { position: absolute; top: 10px; right: 15px; font-size: 11px; }
        .st-wait { color: var(--warning); }
        .st-ok { color: var(--secondary); }
        .hidden { display: none; }
        .view-card { border-left: 4px solid var(--danger); padding: 10px; margin-bottom: 8px; background: #fff5f5; display: flex; justify-content: space-between; align-items: center; }
        .cls-tag { font-size: 11px; background: #eee; padding: 2px 5px; border-radius: 4px; color: #666; }
    </style>
</head>
<body>

<div class="container">
    <h1>班級點名系統</h1>
    
    <div id="step1">
        <label>選擇日期</label>
        <input type="date" id="datePicker" onchange="updateDayLabel()">
        <span id="dayLabel" class="day-label"></span>

        <label>操作模式</label>
        <select id="mode" onchange="toggleModeUI()">
            <option value="roll">📝 老師點名模式</option>
            <option value="view">👁️ 觀察者：全校缺席總覽</option>
            <option value="view_single">👁️ 觀察者：單班詳細看板</option>
        </select>

        <div id="classSelectArea">
            <label>選擇班級</label>
            <select id="classSelect"><option>載入中...</option></select>
        </div>
        <button class="btn btn-blue" onclick="startSystem()">啟動系統</button>
    </div>

    <div id="stepRoll" class="hidden">
        <h2 id="rollTitle" style="text-align:center;"></h2>
        <div id="studentList"></div>
        <button class="btn" style="background:#dadce0;" onclick="location.reload()">返回主選單</button>
    </div>

    <div id="stepView" class="hidden">
        <h2 id="viewHeader" style="text-align:center; font-size:18px;"></h2>
        <div id="summaryArea"></div>
        <button class="btn" style="background:#dadce0;" onclick="location.reload()">返回主選單</button>
    </div>
</div>

<script>
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxRJC2RuH1aPMaz_8rPh7lufZbjXIZ0obItOf7IDTFKpID8HtvLwhuy88r7phqPvHF1bg/exec";
    let fullData = { classes: {}, records: [] };
    let offlineQueue = JSON.parse(localStorage.getItem('attendance_queue') || '[]');

    window.onload = async () => {
        // 設定今日日期與標籤
        const today = new Date().toISOString().split('T')[0];
        document.getElementById('datePicker').value = today;
        updateDayLabel();
        
        // 極速預載
        try {
            const resp = await fetch(`${SCRIPT_URL}?action=initData&date=${today}`);
            fullData = await resp.json();
            renderClassOptions();
            localStorage.setItem('cached_full_data', JSON.stringify(fullData));
        } catch (e) {
            fullData = JSON.parse(localStorage.getItem('cached_full_data') || '{"classes":{}, "records":[]}');
            renderClassOptions();
        }
        setInterval(processQueue, 5000);
    };

    function updateDayLabel() {
        const dateVal = document.getElementById('datePicker').value;
        if (!dateVal) return;
        const days = ['日', '一', '二', '三', '四', '五', '六'];
        const date = new Date(dateVal);
        const dayName = days[date.getDay()];
        document.getElementById('dayLabel').innerText = `(${dayName}) 星期${dayName}`;
    }

    function renderClassOptions() {
        const select = document.getElementById('classSelect');
        const classNames = Object.keys(fullData.classes);
        select.innerHTML = classNames.map(c => `<option value="${c}">${c}</option>`).join('');
    }

    function toggleModeUI() {
        const mode = document.getElementById('mode').value;
        document.getElementById('classSelectArea').classList.toggle('hidden', mode === 'view');
    }

    function startSystem() {
        const mode = document.getElementById('mode').value;
        const cls = document.getElementById('classSelect').value;
        const date = document.getElementById('datePicker').value;
        document.getElementById('step1').classList.add('hidden');
        
        if (mode === 'roll') {
            document.getElementById('stepRoll').classList.remove('hidden');
            document.getElementById('rollTitle').innerText = `${cls} 點名`;
            renderRollMode(cls);
        } else if (mode === 'view') {
            document.getElementById('stepView').classList.remove('hidden');
            document.getElementById('viewHeader').innerText = "全校缺席總覽";
            renderGlobalView();
        } else {
            document.getElementById('stepView').classList.remove('hidden');
            document.getElementById('viewHeader').innerText = `${cls} 詳細看板`;
            renderSingleView(cls);
        }
    }

    function renderRollMode(cls) {
        const students = fullData.classes[cls] || [];
        const records = fullData.records.filter(r => r.className === cls);
        const recordMap = new Map(records.map(r => [r.student, r]));

        document.getElementById('studentList').innerHTML = students.map((name, i) => {
            const rec = recordMap.get(name) || { status: "", note: "" };
            return `
                <div class="card" data-name="${name}" id="card_${i}" data-status="${rec.status}">
                    <div class="sync-indicator" id="sync_${i}">${rec.status ? '● 已存' : ''}</div>
                    <strong>${name}</strong>
                    <div class="status-group">
                        <div class="status-btn ${rec.status === '已到' ? 'active-p' : ''}" id="btn_p_${i}" onclick="handleSelect(${idxToI(i)}, '已到')">已到</div>
                        <div class="status-btn ${rec.status === '請假' ? 'active-a' : ''}" id="btn_a_${i}" onclick="handleSelect(${idxToI(i)}, '請假')">請假</div>
                    </div>
                    <input type="text" id="memo_${i}" class="memo-input" placeholder="備註..." value="${rec.note}" onchange="queueData(${idxToI(i)})">
                </div>
            `;
        }).join('');
    }
    // 修正索引傳遞小問題
    function idxToI(i){ return i; }

    function renderGlobalView() {
        const absents = fullData.records.filter(r => r.status === "請假");
        const area = document.getElementById('summaryArea');
        if (absents.length === 0) {
            area.innerHTML = "<p style='text-align:center; color:#888; margin-top:20px;'>今日目前無人請假</p>";
            return;
        }
        area.innerHTML = absents.map(r => `
            <div class="view-card">
                <div>
                    <span class="cls-tag">${r.className}</span><br>
                    <strong>${r.student}</strong>
                </div>
                <div style="text-align:right;">
                    <span style="color:var(--danger); font-weight:bold;">請假</span><br>
                    <span style="font-size:12px; color:#666;">${r.note || ''}</span>
                </div>
            </div>
        `).join('');
    }

    function renderSingleView(cls) {
        const records = fullData.records.filter(r => r.className === cls);
        const area = document.getElementById('summaryArea');
        if (records.length === 0) {
            area.innerHTML = "<p style='text-align:center; color:#888;'>此班級今日尚無紀錄</p>";
            return;
        }
        area.innerHTML = records.map(r => `
            <div class="view-card" style="border-left-color: ${r.status === '已到' ? 'var(--secondary)' : 'var(--danger)'}">
                <strong>${r.student}</strong>
                <span style="font-size:13px; color:${r.status === '已到' ? '#1e8e3e' : '#d93025'}; font-weight:bold;">${r.status} ${r.note ? '<br><small style="color:#888;font-weight:normal">'+r.note+'</small>' : ''}</span>
            </div>
        `).join('');
    }

    function handleSelect(idx, status) {
        const card = document.getElementById(`card_${idx}`);
        document.getElementById(`btn_p_${idx}`).classList.toggle('active-p', status === '已到');
        document.getElementById(`btn_a_${idx}`).classList.toggle('active-a', status === '請假');
        card.dataset.status = status;
        queueData(idx);
    }

    function queueData(idx) {
        const card = document.getElementById(`card_${idx}`);
        const indicator = document.getElementById(`sync_${idx}`);
        const payload = {
            date: document.getElementById('datePicker').value,
            className: document.getElementById('classSelect').value,
            student: card.dataset.name,
            status: card.dataset.status,
            note: document.getElementById(`memo_${idx}`).value,
            uid: `${document.getElementById('datePicker').value}_${card.dataset.name}`
        };
        indicator.innerText = "● 待同步";
        indicator.className = "sync-indicator st-wait";
        offlineQueue = offlineQueue.filter(q => q.uid !== payload.uid);
        offlineQueue.push(payload);
        localStorage.setItem('attendance_queue', JSON.stringify(offlineQueue));
        processQueue();
    }

    async function processQueue() {
        if (!navigator.onLine || offlineQueue.length === 0) return;
        const item = offlineQueue[0];
        try {
            await fetch(SCRIPT_URL, { method: "POST", mode: "no-cors", body: JSON.stringify(item) });
            offlineQueue.shift();
            localStorage.setItem('attendance_queue', JSON.stringify(offlineQueue));
            updateUI(item.student);
            processQueue();
        } catch (e) {}
    }

    function updateUI(name) {
        const cards = document.querySelectorAll('.card');
        cards.forEach((card, i) => {
            if (card.dataset.name === name) {
                const ind = document.getElementById(`sync_${i}`);
                ind.innerText = "● 已同步";
                ind.className = "sync-indicator st-ok";
            }
        });
    }
</script>
</body>
</html>
