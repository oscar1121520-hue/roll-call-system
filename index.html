<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>班級點名與觀察者系統</title>
    <style>
        :root { --primary: #1a73e8; --success: #34a853; --danger: #ea4335; --bg: #f8f9fa; --obs: #673ab7; }
        body { font-family: -apple-system, sans-serif; background: var(--bg); margin: 0; padding: 15px; }
        .container { max-width: 500px; margin: 0 auto; background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.08); }
        .hidden { display: none !important; }
        #dataStatus { font-size: 13px; text-align: center; color: #666; margin-bottom: 15px; padding: 8px; border-radius: 20px; background: #eee; }
        .date-display { font-size: 18px; font-weight: bold; color: var(--primary); text-align: center; margin: 10px 0; }
        label { display: block; margin: 15px 0 5px; font-weight: bold; color: #444; }
        select, input { width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 8px; font-size: 16px; box-sizing: border-box; }
        .btn { width: 100%; padding: 15px; border: none; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer; transition: 0.2s; margin-top: 10px; }
        .btn-blue { background: var(--primary); color: white; }
        .btn-obs { background: var(--obs); color: white; }
        .card { border-bottom: 1px solid #eee; padding: 15px 0; display: flex; justify-content: space-between; align-items: center; }
        .student-info { flex-grow: 1; font-size: 17px; }
        .btn-group { display: flex; gap: 8px; }
        .opt-btn { padding: 8px 14px; border: 1px solid #ddd; border-radius: 6px; background: white; cursor: pointer; }
        .opt-btn.active-p { background: var(--success); color: white; border-color: var(--success); }
        .opt-btn.active-a { background: var(--danger); color: white; border-color: var(--danger); }
        .obs-item { background: #fff5f5; border-left: 4px solid var(--danger); padding: 10px; margin-bottom: 10px; border-radius: 4px; }
        .obs-class { font-weight: bold; color: var(--danger); font-size: 14px; }
    </style>
</head>
<body>

<div class="container" id="page1">
    <h2 style="text-align:center; margin-top:0;">班級點名系統</h2>
    <div id="dataStatus">等待中...</div>
    <label>選擇日期</label>
    <input type="date" id="dateInput" onchange="loadDataFromServer()">
    <div class="date-display" id="dateWithWeek"></div>
    <label>選擇班級</label>
    <select id="classSelect"><option value="">載入中...</option></select>
    <button class="btn btn-blue" id="enterBtn" onclick="switchToRollPage()" disabled>進入點名</button>
    <button class="btn btn-obs" id="obsBtn" onclick="switchToObserverPage()" disabled>觀察者模式 (缺席總覽)</button>
</div>

<div class="container hidden" id="page2">
    <h3 id="displayClass" style="margin-top:0; color: var(--primary);"></h3>
    <div id="studentList"></div>
    <button class="btn" style="background:#666; color:white; margin-top:20px;" onclick="location.reload()">返回首頁</button>
</div>

<div class="container hidden" id="page3">
    <h3 style="margin-top:0; color: var(--obs);">今日全校缺席總覽</h3>
    <div id="obsList"></div>
    <button class="btn" style="background:#666; color:white; margin-top:20px;" onclick="location.reload()">返回首頁</button>
</div>

<script>
    const GAS_URL = "https://script.google.com/macros/s/AKfycbxRJC2RuH1aPMaz_8rPh7lufZbjXIZ0obItOf7IDTFKpID8HtvLwhuy88r7phqPvHF1bg/exec"; 
    let globalData = { classes: {}, records: [] };

    window.onload = () => {
        document.getElementById('dateInput').value = new Date().toISOString().split('T')[0];
        loadDataFromServer();
    };

    function updateDateLabel() {
        const dateVal = document.getElementById('dateInput').value;
        const days = ['日', '一', '二', '三', '四', '五', '六'];
        const d = new Date(dateVal);
        document.getElementById('dateWithWeek').innerText = `${dateVal} (${days[d.getDay()]})`;
    }

    function loadDataFromServer() {
        updateDateLabel();
        const statusDiv = document.getElementById('dataStatus');
        const date = document.getElementById('dateInput').value;
        statusDiv.innerText = "同步紀錄中...";
        
        fetch(`${GAS_URL}?action=initData&date=${date}`)
            .then(res => res.json())
            .then(data => {
                globalData = data;
                const select = document.getElementById('classSelect');
                const classes = Object.keys(globalData.classes);
                if (classes.length > 0) {
                    select.innerHTML = classes.map(c => `<option value="${c}">${c}</option>`).join('');
                    document.getElementById('enterBtn').disabled = false;
                    document.getElementById('obsBtn').disabled = false;
                    statusDiv.innerText = "連線成功";
                } else {
                    select.innerHTML = '<option value="">當日無班級資料</option>';
                    statusDiv.innerText = "請檢查『班級名單』分頁";
                }
            });
    }

    function switchToRollPage() {
        const cls = document.getElementById('classSelect').value;
        document.getElementById('page1').classList.add('hidden');
        document.getElementById('page2').classList.remove('hidden');
        document.getElementById('displayClass').innerText = "📍 " + cls;
        renderList(cls);
    }

    function renderList(cls) {
        const listDiv = document.getElementById('studentList');
        const students = globalData.classes[cls] || [];
        
        listDiv.innerHTML = students.map(s => {
            // 從 globalData.records 找該學生今天的狀態
            const rec = globalData.records.find(r => r.student === s && r.className === cls);
            const status = rec ? rec.status : "";
            return `
                <div class="card">
                    <div class="student-info"><strong>${s}</strong></div>
                    <div class="btn-group">
                        <button class="opt-btn ${status === '已到' ? 'active-p' : ''}" onclick="doPost('${s}', '已到', this)">已到</button>
                        <button class="opt-btn ${status === '請假' ? 'active-a' : ''}" onclick="doPost('${s}', '請假', this)">請假</button>
                    </div>
                </div>
            `;
        }).join('');
    }

    function doPost(name, status, btn) {
        const cls = document.getElementById('classSelect').value;
        const date = document.getElementById('dateInput').value;
        const parent = btn.parentElement;
        parent.querySelectorAll('.opt-btn').forEach(b => b.classList.remove('active-p', 'active-a'));
        btn.classList.add(status === '已到' ? 'active-p' : 'active-a');

        const payload = { date, className: cls, student: name, status };

        // 立即更新本地 records，確保返回後再進來能看到
        const idx = globalData.records.findIndex(r => r.student === name && r.className === cls);
        if (idx !== -1) globalData.records[idx].status = status;
        else globalData.records.push(payload);

        fetch(GAS_URL, { method: "POST", mode: "no-cors", body: JSON.stringify(payload) });
    }

    function switchToObserverPage() {
        document.getElementById('page1').classList.add('hidden');
        document.getElementById('page3').classList.remove('hidden');
        const obsList = document.getElementById('obsList');
        const absences = globalData.records.filter(r => r.status === '請假');
        obsList.innerHTML = absences.length ? absences.map(r => `
            <div class="obs-item">
                <div class="obs-class">${r.className}</div>
                <strong>${r.student}</strong>
            </div>
        `).join('') : '<div style="text-align:center;color:#999;">目前無人請假</div>';
    }
</script>
</body>
</html>
