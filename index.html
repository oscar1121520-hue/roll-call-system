<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>班級管理系統 - 完整功能版</title>
    <style>
        :root { --primary: #1a73e8; --secondary: #34a853; --danger: #ea4335; --warning: #fbbc05; --bg: #f8f9fa; }
        body { font-family: -apple-system, "Microsoft JhengHei", sans-serif; background: var(--bg); margin: 0; padding: 20px; color: #333; }
        .container { max-width: 500px; margin: 0 auto; background: white; padding: 25px; border-radius: 16px; box-shadow: 0 4px 25px rgba(0,0,0,0.1); }
        h1 { color: var(--primary); text-align: center; font-size: 24px; margin-bottom: 20px; }
        label { display: block; font-weight: bold; margin: 15px 0 8px; color: #555; }
        select, input { width: 100%; padding: 12px; border: 1px solid #dadce0; border-radius: 8px; box-sizing: border-box; font-size: 16px; margin-bottom: 10px; }
        .btn { width: 100%; padding: 15px; border: none; border-radius: 8px; font-size: 18px; font-weight: bold; cursor: pointer; transition: 0.2s; margin-top: 15px; }
        .btn-blue { background: var(--primary); color: white; }
        .card { border: 1px solid #eee; border-radius: 12px; padding: 15px; margin-bottom: 15px; background: #fafafa; position: relative; }
        .status-group { display: flex; gap: 10px; margin: 10px 0; }
        .status-btn { flex: 1; padding: 10px; border: 2px solid #ddd; border-radius: 8px; text-align: center; cursor: pointer; font-weight: bold; color: #666; }
        .active-p { border-color: var(--secondary); background: #e6f4ea; color: #1e8e3e; }
        .active-a { border-color: var(--danger); background: #fce8e8; color: #d93025; }
        .memo-input { width: 100%; padding: 8px; border: 1px solid #eee; border-radius: 6px; box-sizing: border-box; font-size: 14px; }
        .hidden { display: none; }
        .sync-indicator { position: absolute; top: 10px; right: 15px; font-size: 12px; }
        .st-wait { color: var(--warning); font-weight: bold; }
        .st-ok { color: var(--secondary); }
        .loader { text-align: center; padding: 20px; color: var(--primary); font-weight: bold; }
        /* 觀察者樣式 */
        .view-section { margin-top: 20px; border-top: 2px solid #eee; padding-top: 10px; }
        .view-title { font-size: 18px; font-weight: bold; margin-bottom: 10px; display: flex; align-items: center; }
        .badge { margin-left: 10px; font-size: 12px; padding: 2px 8px; border-radius: 10px; color: white; }
        .bg-red { background: var(--danger); }
        .bg-green { background: var(--secondary); }
        .item-row { display: flex; justify-content: space-between; padding: 10px; border-bottom: 1px solid #f0f0f0; }
        .item-note { font-size: 12px; color: #888; }
    </style>
</head>
<body>

<div class="container">
    <h1>班級點名系統</h1>
    <div id="step1">
        <label>模式選擇</label>
        <select id="mode">
            <option value="roll">📝 點名模式 (即時存檔/離線保險)</option>
            <option value="view">👁️ 觀察者看板 (分類顯示)</option>
        </select>
        <label>班級</label>
        <select id="classSelect"><option>載入中...</option></select>
        <label>日期</label>
        <input type="date" id="datePicker">
        <button class="btn btn-blue" onclick="initSystem()">進入系統</button>
    </div>

    <div id="stepRoll" class="hidden">
        <h2 id="rcTitle" style="text-align:center;"></h2>
        <div id="rcLoader" class="loader">正在同步...</div>
        <div id="studentList"></div>
        <button class="btn btn-blue" onclick="manualSync()">強制重試同步</button>
        <button class="btn" style="background:#dadce0;" onclick="location.reload()">返回</button>
    </div>

    <div id="stepView" class="hidden">
        <h2 id="viewTitle" style="text-align:center;"></h2>
        <div id="viewLoader" class="loader">正在產生統計報告...</div>
        
        <div class="view-section">
            <div class="view-title">🚩 請假名單 <span id="absentCount" class="badge bg-red">0</span></div>
            <div id="absentList"></div>
        </div>

        <div class="view-section">
            <div class="view-title">✅ 已到名單 <span id="presentCount" class="badge bg-green">0</span></div>
            <div id="presentList"></div>
        </div>
        
        <button class="btn" style="background:#dadce0; margin-top:20px;" onclick="location.reload()">返回</button>
    </div>
</div>

<script>
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxRJC2RuH1aPMaz_8rPh7lufZbjXIZ0obItOf7IDTFKpID8HtvLwhuy88r7phqPvHF1bg/exec";
    let offlineQueue = JSON.parse(localStorage.getItem('attendance_queue') || '[]');

    window.onload = () => {
        document.getElementById('datePicker').value = new Date().toISOString().split('T')[0];
        fetch(`${SCRIPT_URL}?action=getClasses`)
            .then(r => r.json())
            .then(d => {
                document.getElementById('classSelect').innerHTML = d.map(c => `<option value="${c}">${c}</option>`).join('');
                localStorage.setItem('cached_classes', JSON.stringify(d));
            })
            .catch(() => {
                const cached = JSON.parse(localStorage.getItem('cached_classes') || '[]');
                if(cached.length) document.getElementById('classSelect').innerHTML = cached.map(c => `<option value="${c}">${c}</option>`).join('');
            });
        setInterval(processQueue, 5000);
    };

    async function initSystem() {
        const mode = document.getElementById('mode').value;
        const cls = document.getElementById('classSelect').value;
        const date = document.getElementById('datePicker').value;
        document.getElementById('step1').classList.add('hidden');

        if (mode === 'roll') {
            document.getElementById('stepRoll').classList.remove('hidden');
            document.getElementById('rcTitle').innerText = cls;
            try {
                const resp = await fetch(`${SCRIPT_URL}?action=getStudents&className=${encodeURIComponent(cls)}&date=${date}`);
                const data = await resp.json();
                document.getElementById('rcLoader').classList.add('hidden');
                renderRollList(data);
                localStorage.setItem(`cache_${cls}_${date}`, JSON.stringify(data));
            } catch (e) {
                const cached = JSON.parse(localStorage.getItem(`cache_${cls}_${date}`) || '[]');
                document.getElementById('rcLoader').classList.add('hidden');
                renderRollList(cached);
            }
        } else {
            document.getElementById('stepView').classList.remove('hidden');
            document.getElementById('viewTitle').innerText = `${cls} 出席看板`;
            setupViewMode(cls, date);
        }
    }

    function renderRollList(data) {
        document.getElementById('studentList').innerHTML = data.map((item, i) => `
            <div class="card" data-name="${item.name}" id="card_${i}" data-status="${item.status}">
                <div class="sync-indicator" id="sync_${i}">${item.status ? '● 已存檔' : ''}</div>
                <strong>${item.name}</strong>
                <div class="status-group">
                    <div class="status-btn ${item.status === '已到' ? 'active-p' : ''}" id="btn_p_${i}" onclick="handleSelect(${i}, '已到')">已到</div>
                    <div class="status-btn ${item.status === '請假' ? 'active-a' : ''}" id="btn_a_${i}" onclick="handleSelect(${i}, '請假')">請假</div>
                </div>
                <input type="text" id="memo_${i}" class="memo-input" placeholder="備註..." value="${item.note || ''}" onchange="queueData(${i})">
            </div>
        `).join('');
    }

    function handleSelect(idx, status) {
        const card = document.getElementById(`card_${idx}`);
        document.getElementById(`btn_p_${idx}`).classList.toggle('active-p', status === '已到');
        document.getElementById(`btn_a_${idx}`).classList.toggle('active-a', status === '請假');
        card.dataset.status = status;
        queueData(idx);
    }

    function queueData(idx) {
        const card = document.getElementById(`card_${idx}`);
        const indicator = document.getElementById(`sync_${idx}`);
        const payload = {
            date: document.getElementById('datePicker').value,
            className: document.getElementById('classSelect').value,
            student: card.dataset.name,
            status: card.dataset.status,
            note: document.getElementById(`memo_${idx}`).value,
            uid: `${document.getElementById('datePicker').value}_${card.dataset.name}`
        };
        indicator.innerText = "● 等待同步...";
        indicator.className = "sync-indicator st-wait";
        offlineQueue = offlineQueue.filter(q => q.uid !== payload.uid);
        offlineQueue.push(payload);
        localStorage.setItem('attendance_queue', JSON.stringify(offlineQueue));
        processQueue();
    }

    async function processQueue() {
        if (!navigator.onLine || offlineQueue.length === 0) return;
        const item = offlineQueue[0];
        try {
            await fetch(SCRIPT_URL, { method: "POST", mode: "no-cors", body: JSON.stringify(item) });
            offlineQueue.shift();
            localStorage.setItem('attendance_queue', JSON.stringify(offlineQueue));
            updateSyncUI(item.student);
            processQueue();
        } catch (e) { console.log("網路不穩中..."); }
    }

    function updateSyncUI(name) {
        const cards = document.querySelectorAll('.card');
        cards.forEach((card, i) => {
            if (card.dataset.name === name) {
                const ind = document.getElementById(`sync_${i}`);
                ind.innerText = "● 已同步";
                ind.className = "sync-indicator st-ok";
            }
        });
    }

    async function setupViewMode(cls, date) {
        try {
            const resp = await fetch(`${SCRIPT_URL}?action=getViewOnly&className=${encodeURIComponent(cls)}&date=${date}`);
            const data = await resp.json();
            document.getElementById('viewLoader').classList.add('hidden');
            
            document.getElementById('absentCount').innerText = data.absent.length;
            document.getElementById('presentCount').innerText = data.present.length;

            document.getElementById('absentList').innerHTML = data.absent.length ? 
                data.absent.map(r => `<div class="item-row"><span>${r.name}</span><span class="item-note">${r.note}</span></div>`).join('') : "<p>（全數出席）</p>";
            
            document.getElementById('presentList').innerHTML = data.present.length ? 
                data.present.map(r => `<div class="item-row"><span>${r.name}</span><span class="item-note">${r.note}</span></div>`).join('') : "<p>（暫無資料）</p>";
        } catch (e) { alert("讀取失敗，請確認網路連線"); }
    }

    function manualSync() { processQueue(); alert("嘗試同步中..."); }
</script>
</body>
</html>
