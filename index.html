<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>班級管理系統 - 穩定修復版</title>
    <style>
        :root { --primary: #1a73e8; --secondary: #34a853; --danger: #ea4335; --warning: #fbbc05; --bg: #f8f9fa; }
        body { font-family: -apple-system, "Microsoft JhengHei", sans-serif; background: var(--bg); margin: 0; padding: 15px; }
        .container { max-width: 500px; margin: 0 auto; background: white; padding: 20px; border-radius: 16px; box-shadow: 0 4px 20px rgba(0,0,0,0.1); }
        h1 { color: var(--primary); text-align: center; font-size: 20px; }
        label { display: block; font-weight: bold; margin: 12px 0 6px; }
        .day-label { font-size: 14px; color: var(--primary); font-weight: bold; margin-bottom: 10px; display: block; }
        select, input { width: 100%; padding: 12px; border: 1px solid #dadce0; border-radius: 8px; box-sizing: border-box; font-size: 16px; margin-bottom: 10px; }
        .btn { width: 100%; padding: 14px; border: none; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer; margin-top: 10px; }
        .btn-blue { background: var(--primary); color: white; }
        .card { border: 1px solid #eee; border-radius: 12px; padding: 15px; margin-bottom: 12px; background: #fafafa; position: relative; }
        .status-group { display: flex; gap: 8px; margin: 10px 0; }
        .status-btn { flex: 1; padding: 10px; border: 2px solid #ddd; border-radius: 8px; text-align: center; cursor: pointer; font-weight: bold; transition: 0.2s; }
        .active-p { border-color: var(--secondary); background: #e6f4ea; color: #1e8e3e; }
        .active-a { border-color: var(--danger); background: #fce8e8; color: #d93025; }
        .sync-indicator { position: absolute; top: 10px; right: 15px; font-size: 11px; }
        .st-wait { color: var(--warning); font-weight: bold; }
        .st-ok { color: var(--secondary); font-weight: bold; }
        .hidden { display: none; }
        .view-card { border-left: 4px solid var(--danger); padding: 10px; margin-bottom: 8px; background: #fff5f5; display: flex; justify-content: space-between; align-items: center; border-radius: 4px; }
        .cls-tag { font-size: 11px; background: #eee; padding: 2px 5px; border-radius: 4px; }
    </style>
</head>
<body>

<div class="container">
    <h1 id="mainTitle">班級管理系統</h1>
    
    <div id="step1">
        <label>選擇日期</label>
        <input type="date" id="datePicker" onchange="updateDayLabel()">
        <span id="dayLabel" class="day-label"></span>

        <label>操作模式</label>
        <select id="mode" onchange="toggleModeUI()"><option value="roll">📝 點名模式</option><option value="view">👁️ 全校缺席總覽</option><option value="view_single">👁️ 單班詳細看板</option></select>

        <div id="classSelectArea"><label>選擇班級</label><select id="classSelect"><option>讀取資料中...</option></select></div>
        <button class="btn btn-blue" id="startBtn" onclick="startSystem()">啟動系統</button>
    </div>

    <div id="stepRoll" class="hidden">
        <h3 id="rollTitle" style="text-align:center;"></h3>
        <div id="studentList"></div>
        <button class="btn" style="background:#ddd;" onclick="safeReturn()">返回主選單</button>
    </div>

    <div id="stepView" class="hidden">
        <h3 id="viewHeader" style="text-align:center;"></h3>
        <div id="summaryArea"></div>
        <button class="btn" style="background:#ddd;" onclick="location.reload()">返回主選單</button>
    </div>
</div>

<script>
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxRJC2RuH1aPMaz_8rPh7lufZbjXIZ0obItOf7IDTFKpID8HtvLwhuy88r7phqPvHF1bg/exec";
    let fullData = { classes: {}, records: [] };
    let offlineQueue = JSON.parse(localStorage.getItem('attendance_queue') || '[]');

    window.onload = () => {
        const today = new Date().toISOString().split('T')[0];
        document.getElementById('datePicker').value = today;
        updateDayLabel();
        loadData();
        setInterval(processQueue, 3000);
    };

    async function loadData() {
        const date = document.getElementById('datePicker').value;
        const btn = document.getElementById('startBtn');
        try {
            const resp = await fetch(`${SCRIPT_URL}?action=initData&date=${date}`);
            fullData = await resp.json();
            renderClassOptions();
            localStorage.setItem('cached_full_data', JSON.stringify(fullData));
        } catch (e) {
            fullData = JSON.parse(localStorage.getItem('cached_full_data') || '{"classes":{}, "records":[]}');
            renderClassOptions();
        }
    }

    function renderClassOptions() {
        const select = document.getElementById('classSelect');
        const classNames = Object.keys(fullData.classes);
        if (classNames.length > 0) {
            select.innerHTML = classNames.map(c => `<option value="${c}">${c}</option>`).join('');
        }
    }

    function updateDayLabel() {
        const days = ['日', '一', '二', '三', '四', '五', '六'];
        const date = new Date(document.getElementById('datePicker').value);
        if (!isNaN(date.getTime())) {
            const day = days[date.getDay()];
            document.getElementById('dayLabel').innerText = `(${day}) 星期${day}`;
        }
    }

    function toggleModeUI() {
        document.getElementById('classSelectArea').classList.toggle('hidden', document.getElementById('mode').value === 'view');
    }

    async function startSystem() {
        const btn = document.getElementById('startBtn');
        btn.innerText = "載入中...";
        btn.disabled = true;

        try {
            await loadData(); // 進入前刷新最新狀態
            const mode = document.getElementById('mode').value;
            const cls = document.getElementById('classSelect').value;
            document.getElementById('step1').classList.add('hidden');
            
            if (mode === 'roll') {
                document.getElementById('stepRoll').classList.remove('hidden');
                document.getElementById('rollTitle').innerText = cls;
                renderRollMode(cls);
            } else {
                document.getElementById('stepView').classList.remove('hidden');
                document.getElementById('viewHeader').innerText = (mode === 'view' ? "全校缺席總覽" : cls + " 看板");
                mode === 'view' ? renderGlobalView() : renderSingleView(cls);
            }
        } catch(err) {
            alert("啟動失敗，請檢查網路後重試");
        } finally {
            btn.innerText = "啟動系統";
            btn.disabled = false;
        }
    }

    function renderRollMode(cls) {
        const students = fullData.classes[cls] || [];
        const records = fullData.records.filter(r => r.className === cls);
        const recordMap = new Map(records.map(r => [r.student, r]));

        document.getElementById('studentList').innerHTML = students.map((name, i) => {
            const rec = recordMap.get(name) || { status: "", note: "" };
            return `
                <div class="card" id="card_${i}" data-name="${name}" data-status="${rec.status}">
                    <div class="sync-indicator" id="sync_${i}">${rec.status ? '<span class="st-ok">● 已同步</span>' : ''}</div>
                    <strong>${name}</strong>
                    <div class="status-group">
                        <div class="status-btn ${rec.status === '已到' ? 'active-p' : ''}" id="btn_p_${i}" onclick="handleSelect(${i}, '已到')">已到</div>
                        <div class="status-btn ${rec.status === '請假' ? 'active-a' : ''}" id="btn_a_${i}" onclick="handleSelect(${i}, '請假')">請假</div>
                    </div>
                    <input type="text" id="memo_${i}" class="memo-input" placeholder="備註..." value="${rec.note}" onchange="queueData(${i})">
                </div>
            `;
        }).join('');
    }

    function handleSelect(idx, status) {
        const card = document.getElementById(`card_${idx}`);
        document.getElementById(`btn_p_${idx}`).className = 'status-btn ' + (status === '已到' ? 'active-p' : '');
        document.getElementById(`btn_a_${idx}`).className = 'status-btn ' + (status === '請假' ? 'active-a' : '');
        card.dataset.status = status;
        queueData(idx);
    }

    function queueData(idx) {
        const card = document.getElementById(`card_${idx}`);
        const name = card.dataset.name;
        const status = card.dataset.status;
        const note = document.getElementById(`memo_${idx}`).value;
        const date = document.getElementById('datePicker').value;
        const cls = document.getElementById('classSelect').value;

        const payload = { date, className: cls, student: name, status, note, uid: `${date}_${name}` };
        
        document.getElementById(`sync_${idx}`).innerHTML = '<span class="st-wait">● 待同步</span>';
        
        offlineQueue = offlineQueue.filter(q => q.uid !== payload.uid);
        offlineQueue.push(payload);
        localStorage.setItem('attendance_queue', JSON.stringify(offlineQueue));
        processQueue();
    }

    async function processQueue() {
        if (!navigator.onLine || offlineQueue.length === 0) return;
        const item = offlineQueue[0];
        try {
            await fetch(SCRIPT_URL, { method: "POST", mode: "no-cors", body: JSON.stringify(item) });
            offlineQueue.shift();
            localStorage.setItem('attendance_queue', JSON.stringify(offlineQueue));
            
            // 同步後靜默更新 fullData 避免閃爍
            const existingIdx = fullData.records.findIndex(r => r.student === item.student && r.className === item.className);
            if(existingIdx > -1) fullData.records[existingIdx] = item; else fullData.records.push(item);
            
            updateSyncUI(item.student);
            processQueue();
        } catch (e) {}
    }

    function updateSyncUI(name) {
        const cards = document.querySelectorAll('.card');
        cards.forEach((card, i) => {
            if (card.dataset.name === name) {
                document.getElementById(`sync_${i}`).innerHTML = '<span class="st-ok">● 已同步</span>';
            }
        });
    }

    function renderGlobalView() {
        const absents = fullData.records.filter(r => r.status === "請假");
        document.getElementById('summaryArea').innerHTML = absents.length ? absents.map(r => `
            <div class="view-card">
                <div><span class="cls-tag">${r.className}</span><br><strong>${r.student}</strong></div>
                <div style="text-align:right;"><span style="color:var(--danger); font-weight:bold;">請假</span><br><small>${r.note || ''}</small></div>
            </div>
        `).join('') : "<p style='text-align:center; color:#999;'>今日無人請假</p>";
    }

    function renderSingleView(cls) {
        const records = fullData.records.filter(r => r.className === cls);
        document.getElementById('summaryArea').innerHTML = records.length ? records.map(r => `
            <div class="view-card" style="border-left-color:${r.status === '已到' ? 'var(--secondary)' : 'var(--danger)'}">
                <strong>${r.student}</strong><span>${r.status} <small>${r.note || ''}</small></span>
            </div>
        `).join('') : "<p style='text-align:center; color:#999;'>尚無紀錄</p>";
    }

    function safeReturn() {
        if (offlineQueue.length > 0) {
            if (!confirm("尚有資料同步中，確定返回？")) return;
        }
        location.reload();
    }
</script>
</body>
</html>
